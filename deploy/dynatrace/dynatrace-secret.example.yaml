# DynaKube tokens secret — DO NOT COMMIT REAL TOKENS.
# Create it at deploy time from environment variables (see deploy.sh) or copy this
# file to dynatrace-secret.yaml and fill in real values (gitignored).
#
#   apiToken       -> Dynatrace operator token (scopes: read/write config, entities,
#                     settings, activeGateTokenManagement, etc.)
#   dataIngestToken-> Dynatrace data ingest token (metrics.ingest, logs.ingest,
#                     openTelemetryTrace.ingest) — used by the ActiveGate.
apiVersion: v1
kind: Secret
metadata:
  name: otel-arrow-demo
  namespace: dynatrace
type: Opaque
stringData:
  apiToken: "dt0c01.REPLACE_ME"
  dataIngestToken: "dt0c01.REPLACE_ME"
