# Gateway -> Dynatrace OTLP egress secret — DO NOT COMMIT REAL TOKENS.
# The gateway collector is the ONLY workload that talks to Dynatrace with an OTLP
# ingest token. Copy to gateway-secret.yaml (gitignored) or create via deploy.sh.
#
#   endpoint  -> Dynatrace OTLP base, e.g. https://<your-tenant>.live.dynatrace.com/api
#                (the collector appends /v2/otlp).
#   apiToken  -> Dynatrace data ingest token with metrics.ingest + logs.ingest +
#                openTelemetryTrace.ingest scopes.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-dynatrace
  namespace: default
type: Opaque
stringData:
  endpoint: "https://<your-tenant>.live.dynatrace.com/api"
  apiToken: "dt0c01.REPLACE_ME"
