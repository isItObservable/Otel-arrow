# ============================================================================
# Dynatrace OTLP ingest secret — TEMPLATE. Copy to dynatrace-secret.yaml, fill in
# your own data-ingest token, and apply into EACH engine namespace you run:
#
#   for ns in bench-fluentbit bench-collector bench-arrow; do
#     kubectl -n "$ns" apply -f dynatrace-secret.yaml
#   done
#
# Also set the exporter endpoint host in each engine's config to your tenant:
#   https://YOUR-TENANT.live.dynatrace.com/api/v2/otlp   (SaaS)
#   https://YOUR-ACTIVEGATE:9999/e/<env-id>/api/v2/otlp  (ActiveGate)
#
# The token needs the `openTelemetryTrace.ingest`, `metrics.ingest` and
# `logs.ingest` scopes. NEVER commit a real token — dynatrace-secret.yaml
# should be git-ignored.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: dynatrace-otlp
type: Opaque
stringData:
  # Replace with your Dynatrace data-ingest token (format: dt0c01.XXXX.YYYY).
  dataIngestToken: "dt0c01.REPLACE_WITH_YOUR_INGEST_TOKEN"
