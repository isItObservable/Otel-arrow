# hipster-shop (Online Boutique) — appProtocol'd Service specs
#
# Every inter-service gRPC port declares `appProtocol: grpc` and the frontend
# HTTP port declares `appProtocol: http`, so the Istio ambient waypoint can
# L7-classify and route the traffic. The apps read the collector endpoint from
# the COLLECTOR_SERVICE_ADDR env var (host:port, OTLP/gRPC :4317) — see
# environment/APPPROTOCOL.md. Without appProtocol the waypoint drops spans.
---
apiVersion: v1
kind: Service
metadata:
  name: adservice
  namespace: hipster-shop
  labels:
    app: adservice
spec:
  selector:
    app: adservice
  ports:
  - name: grpc
    port: 9555
    protocol: TCP
    targetPort: 9555
    appProtocol: grpc
---
