apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
    benchmark: otel-arrow-benchmark
    benchmark.engine: fluent-bit-v5.1.4
  name: frontend
  namespace: hipster-shop
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
      labels:
        app: frontend
        benchmark: otel-arrow-benchmark
        benchmark.engine: fluent-bit-v5.1.4
    spec:
      containers:
      - env:
        - name: ENABLE_TRACING
          value: "1"
        - name: COLLECTOR_SERVICE_ADDR
          value: bench-collector-otlp.bench-collector.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://bench-collector-otlp.bench-collector.svc.cluster.local:4318
        - name: OTEL_SERVICE_NAME
          value: frontend
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=hipster-shop,benchmark.engine=otel-collector-contrib,benchmark.run=otel-arrow-benchmark
        - name: PORT
          value: "8080"
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: productcatalogservice:3550
        - name: CURRENCY_SERVICE_ADDR
          value: currencyservice:7000
        - name: CART_SERVICE_ADDR
          value: cartservice:7070
        - name: RECOMMENDATION_SERVICE_ADDR
          value: recommendationservice:8080
        - name: SHIPPING_SERVICE_ADDR
          value: shippingservice:50051
        - name: CHECKOUT_SERVICE_ADDR
          value: checkoutservice:5050
        - name: AD_SERVICE_ADDR
          value: adservice:9555
        - name: SHOPPING_ASSISTANT_SERVICE_ADDR
          value: shoppingassistantservice:80
        - name: ENABLE_PROFILER
          value: "0"
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend:v0.10.2
        livenessProbe:
          httpGet:
            httpHeaders:
            - name: Cookie
              value: shop_session-id=x-liveness-probe
            path: /_healthz
            port: 8080
          initialDelaySeconds: 10
        name: server
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            httpHeaders:
            - name: Cookie
              value: shop_session-id=x-readiness-probe
            path: /_healthz
            port: 8080
          initialDelaySeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: frontend
