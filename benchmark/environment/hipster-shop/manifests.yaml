apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: adservice
    benchmark: otel-arrow-benchmark
    benchmark.engine: fluent-bit-v5.1.4
  name: adservice
  namespace: hipster-shop
spec:
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
        benchmark: otel-arrow-benchmark
        benchmark.engine: fluent-bit-v5.1.4
    spec:
      containers:
      - env:
        - name: ENABLE_TRACING
          value: "1"
        - name: COLLECTOR_SERVICE_ADDR
          value: bench-collector-otlp.bench-collector.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://bench-collector-otlp.bench-collector.svc.cluster.local:4318
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=hipster-shop,benchmark.engine=otel-collector-contrib,benchmark.run=otel-arrow-benchmark
        - name: PORT
          value: "9555"
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/adservice:v0.10.2
        livenessProbe:
          grpc:
            port: 9555
          initialDelaySeconds: 20
          periodSeconds: 15
        name: server
        ports:
        - containerPort: 9555
        readinessProbe:
          grpc:
            port: 9555
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          limits:
            cpu: 300m
            memory: 300Mi
          requests:
            cpu: 200m
            memory: 180Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: adservice
      terminationGracePeriodSeconds: 5
---
