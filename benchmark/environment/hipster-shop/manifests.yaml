# hipster-shop (Online Boutique, v0.10.2) — rendered application manifests.
#
# WHICH ENV VAR REPOINTS THE APPS AT THE COLLECTOR
# Online Boutique services read COLLECTOR_SERVICE_ADDR (host:port, OTLP/gRPC) —
# NOT OTEL_EXPORTER_OTLP_ENDPOINT. Both are set here: COLLECTOR_SERVICE_ADDR is
# the one the app code reads and what makes spans appear; the OTLP endpoint var
# is set so any SDK-native / auto-instrumented path agrees. Upstream ships
# neither, so these are additive and idempotent (strategic-merge on env `name`).
# redis-cart is intentionally not patched (stock redis, no OTel SDK) but still
# gets a waypoint and so still contributes Istio spans + access logs.
#
# LOAD: the bundled loadgenerator Deployment is removed; the controlled ramp
# jobs in environment/loadgenerator/ drive both apps on one VU ladder instead.
#
# appProtocol is set on every Service port (see services-appprotocol.yaml) so
# the Istio ambient waypoint can L7-route the gRPC/HTTP traffic.
