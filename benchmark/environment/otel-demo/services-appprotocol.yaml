# otel-demo — appProtocol'd Service specs (OpenTelemetry Demo)
#
# Captured from a validated benchmark run. Every Service port carrying OTLP /
# gRPC / HTTP traffic declares an explicit `appProtocol`. This is REQUIRED when
# the namespace is enrolled in an Istio ambient waypoint: without appProtocol
# the waypoint treats the port as opaque TCP and cannot L7-route OTLP, which
# silently drops spans. `grpc` ports carry gRPC (incl. OTLP/gRPC); `http` ports
# carry HTTP/OTLP-HTTP. See environment/APPPROTOCOL.md for the full rationale.
---
apiVersion: v1
kind: Service
metadata:
  name: ad
  namespace: otel-demo
  labels:
    app.kubernetes.io/component: ad
    app.kubernetes.io/name: ad
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/version: 3.1.0
    helm.sh/chart: opentelemetry-demo-0.42.6
    opentelemetry.io/name: ad
spec:
  selector:
    opentelemetry.io/name: ad
  ports:
  - name: prometheus
    port: 9465
    protocol: TCP
    targetPort: 9465
  - name: tcp-service
    port: 8080
    protocol: TCP
    targetPort: 8080
    appProtocol: grpc
