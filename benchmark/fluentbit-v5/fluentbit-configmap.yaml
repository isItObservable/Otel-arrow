# ============================================================================
# Variant C — Fluent Bit v5 (engine under test: fluent/fluent-bit:5.1.5)
# ServiceAccount + RBAC + agent/gateway ConfigMaps + gateway Service.
#
# TWO-TIER agent -> gateway topology:
#   [DaemonSet AGENT]   tail(container/pod logs) -> kubernetes filter(enrich)
#                       -> opentelemetry OUTPUT (OTLP) -> [GATEWAY]
#   [Deployment GATEWAY] opentelemetry IN (logs+metrics+traces from the agent,
#                       the OTel Demo and hipster-shop) + prometheus_scrape
#                       (istiod :15014) + fluentbit_metrics (FB self-metrics)
#                       -> content_modifier (benchmark.* attrs) ->
#                       cumulative_to_delta (metrics) -> opentelemetry OUTPUT
#                       -> Dynatrace (OTLP/HTTP).
#
# All plugins verified present in Fluent Bit 5.1.x: in_tail, filter_kubernetes,
# in_opentelemetry, in_prometheus_scrape, in_fluentbit_metrics,
# out_opentelemetry, processor_content_modifier, processor_cumulative_to_delta.
#
# Apps target the GATEWAY (Service bench-fluentbit-otlp). The engine under test
# is BOTH pods -> cost/census KPIs SUM agent + gateway. Namespace is kept free
# of any vendor auto-injection (inject:false) so the measurement is pure.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata: { name: bench-fluentbit, namespace: bench-fluentbit }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: bench-fluentbit }
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: bench-fluentbit }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bench-fluentbit }
subjects:
  - { kind: ServiceAccount, name: bench-fluentbit, namespace: bench-fluentbit }
---
# ---------- AGENT (DaemonSet) — logs only, YAML config ----------
apiVersion: v1
kind: ConfigMap
metadata: { name: bench-fluentbit-agent-config, namespace: bench-fluentbit }
data:
  fluent-bit.yaml: |
    service:
      http_server: on
      http_listen: 0.0.0.0
      http_port: 2020
      log_level: info
      storage.metrics: on
    pipeline:
      inputs:
        - name: tail
          tag: kube.*
          path: /var/log/containers/*.log
          exclude_path: /var/log/containers/*bench-fluentbit*.log
          multiline.parser: cri
          read_from_head: false
          skip_long_lines: on
          refresh_interval: 5
      filters:
        - name: kubernetes
          match: kube.*
          merge_log: on
          keep_log: off
      outputs:
        - name: opentelemetry
          match: '*'
          host: bench-fluentbit-otlp.bench-fluentbit.svc.cluster.local
          port: 4318
          logs_uri: /v1/logs
          tls: off
---
# ---------- GATEWAY (Deployment) — OTLP in + metrics + internal, YAML config ----------
apiVersion: v1
kind: ConfigMap
metadata: { name: bench-fluentbit-gateway-config, namespace: bench-fluentbit }
data:
  fluent-bit.yaml: |
    service:
      http_server: on
      http_listen: 0.0.0.0
      http_port: 2020
      log_level: info
      storage.metrics: on
    pipeline:
      inputs:
        # logs + metrics + traces from the agent and the demo apps (OTLP).
        - name: opentelemetry
          tag: otlp.*
          listen: 0.0.0.0
          port: 4318
        # istio control-plane metrics.
        - name: prometheus_scrape
          tag: metrics.istiod
          host: istiod.istio-system.svc.cluster.local
          port: 15014
          metrics_path: /metrics
          scrape_interval: 15s
        # FB OWN internal/self metrics -> converted + exported.
        - name: fluentbit_metrics
          tag: internal.metrics
          scrape_interval: 15s
      # NOTE: a gateway-side kubernetes filter CANNOT work on OTLP-received logs —
      # filter_kubernetes derives metadata from the tail file-path tag shape
      # (kube.var.log.containers.*) and skips on every otlp.* record. App OTLP
      # logs already carry k8s resource attributes from their OTel SDKs, and the
      # agent enriches node-tailed logs before forwarding, so the filter is
      # intentionally omitted on the gateway.
      outputs:
        - name: opentelemetry
          match: '*'
          # Set to your Dynatrace OTLP endpoint host (see dynatrace-secret.example.yaml).
          host: YOUR-TENANT.live.dynatrace.com
          port: 443
          tls: on
          tls.verify: off
          metrics_uri: /api/v2/otlp/v1/metrics
          traces_uri: /api/v2/otlp/v1/traces
          logs_uri: /api/v2/otlp/v1/logs
          header: Authorization Api-Token ${DT_INGEST_TOKEN}
          log_response_payload: false
          # NOTE: opentelemetry_envelope is intentionally NOT used. On Fluent Bit
          # 5.1.x it heap-corrupts the process under sustained mesh load; removing
          # it yields a clean 12h+ soak with 0 drops. FB-native metrics ship via
          # the out_opentelemetry native OTLP conversion (Dynatrace accepts them).
          # Keep processor keys EXPLICIT per signal.
          processors:
            metrics:
              # Dynatrace OTLP ingest rejects cumulative-only monotonic sums ->
              # convert to delta before export.
              - name: cumulative_to_delta
            logs:
              - name: content_modifier
                context: otel_resource_attributes
                action: upsert
                key: benchmark.run
                value: otel-arrow-benchmark
              - name: content_modifier
                context: otel_resource_attributes
                action: upsert
                key: benchmark.arm
                value: A
            traces: []   # no traces processors (FB 5.1.x trace re-encode path)
---
# Apps + agent target the GATEWAY via this Service.
apiVersion: v1
kind: Service
metadata: { name: bench-fluentbit-otlp, namespace: bench-fluentbit, labels: { app: bench-fluentbit-gateway } }
spec:
  selector: { app: bench-fluentbit-gateway }
  ports:
    - { name: otlp-http, port: 4318, targetPort: 4318 }
