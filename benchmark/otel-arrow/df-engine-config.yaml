version: otel_dataflow/v1
engine:
  # ── Engine self-observability (internal metrics) ──────────────────────────
  # The benchmark's whole point is watching the engine under load — provider: its
  # routes the engine's OWN registry-backed metrics (per-node throughput, channel
  # saturation/backpressure, Tokio runtime) through this dedicated observability
  # pipeline (exactly one receiver:internal_telemetry per engine process, under
  # engine.observability — NOT in a user pipeline group). processor:debug prints
  # each metrics batch to stdout; scrape the admin endpoint /api/v1/metrics on
  # :8080 for the Prometheus view used by the benchmark dashboards.
  telemetry:
    metrics:
      provider: its
  observability:
    pipeline:
      nodes:
        internal_telemetry/engine:
          type: receiver:internal_telemetry
          config:
            metrics: { interval: 30s }
        debug/inspect:
          type: processor:debug
          config:
            verbosity: normal
            signals: [metrics]
        noop/sink: { type: exporter:noop, config: {} }
      connections:
        - { from: internal_telemetry/engine, to: debug/inspect }
        - { from: debug/inspect, to: noop/sink }
groups:
  default:
    pipelines:
      main:
        policies:
          channel_capacity:
            control: { node: 100, pipeline: 100 }
            pdata: 128
        nodes:
          otlp_in:
            type: receiver:otlp
            config:
              protocols:
                grpc:
                  listening_addr: 0.0.0.0:4317
                http:
                  listening_addr: 0.0.0.0:4318
          enrich:
            type: processor:attribute
            config:
              actions:
                - key: benchmark.engine
                  action: upsert
                  value: otel-arrow-native
                - key: k8s.cluster.name
                  action: upsert
                  value: otel-arrow-demo
          # OPL (df_engine's NATIVE query surface) — the storyboard "OPL vs KQL"
          # beat, made live in the benchmark path. contains()/matches() READ the
          # body and BRANCH (KQL can't — upstream #1634): conditional severity +
          # whole-value SHA-256 hash redaction of e-mail bodies. Runtime-proven on
          # df_engine:0.50.0 (@7502e7d): 50 ERROR / 50 CLEARED, 50 hashed, 0 leaks
          # (ISI-3767). Honest caveat: OPL has no regex-replace, so redaction is a
          # HASH (Fluent Bit), not a substring mask (Go Collector).
          opl:
            type: processor:transform
            config:
              opl_query: |
                logs
                | if (contains(body, "error")) { set severity_text = "ERROR" } else { set severity_text = "CLEARED" }
                | if (matches(body, r"[a-zA-Z0-9._%+-]+@[a-zA-Z0-9._-]+")) { set attributes["pii.email.detected"] = "true", body = concat("REDACTED:", encode(sha256(body), "hex")) }
          batch:
            type: processor:batch
            config:
              otap: { min_size: 1000, sizer: items }
              max_batch_duration: 3s
          dt_out:
            type: exporter:otlp_http
            config:
              endpoint: http://127.0.0.1:4318
              client_pool_size: 4
              http: {}
        connections:
          - from: otlp_in
            to: enrich
          - from: enrich
            to: opl
          - from: opl
            to: batch
          - from: batch
            to: dt_out
