# ============================================================================
# df_engine pipeline spec (otel_dataflow/v1) — standalone reference.
#
# This is the exact pipeline mounted into the df_engine container as
# /conf/df_engine.yaml (ConfigMap bench-arrow-dfengine-config in
# df-engine-config.yaml). It is reproduced here on its own for readability.
#
# Model: otap-dataflow v0.61.0. The engine runs one pipeline instance per core
# (SO_REUSEPORT on 4317/4318) and opens one forwarder channel per core.
# Verified field names against the v0.61.0 binary:
#   - version: otel_dataflow/v1
#   - receiver node  type: receiver:otlp   (grpc/http listening_addr)
#   - exporter node  type: exporter:otlp_grpc  (grpc_endpoint)
#   - connections: [{from: receiver, to: exporter}]
#
# Available URNs reported by the binary include receiver:otlp, exporter:otlp_grpc,
# exporter:otlp_http, exporter:otap (the Arrow-native export path).
# ============================================================================
version: otel_dataflow/v1
engine: {}
groups:
  default:
    pipelines:
      main:
        policies:
          channel_capacity: { control: { node: 100, pipeline: 100 }, pdata: 128 }
        nodes:
          receiver:
            type: receiver:otlp
            config:
              protocols:
                grpc: { listening_addr: "0.0.0.0:4317" }
                http: { listening_addr: "0.0.0.0:4318" }
          exporter:
            type: exporter:otlp_grpc
            config:
              grpc_endpoint: "http://bench-arrow-fwd.bench-arrow.svc.cluster.local:4317"
        connections:
          - { from: receiver, to: exporter }
