# ============================================================================
# Variant A — OTel-Arrow native engine (df_engine) workloads.
# df_engine Deployment (engine under test) + contrib agent DaemonSet +
# contrib forwarder Deployment. ConfigMaps/RBAC/Services in df-engine-config.yaml.
# The forwarder DT_INGEST_TOKEN env is read from the dynatrace-otlp secret
# (see ../dynatrace-secret.example.yaml).
# ============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bench-arrow-agent
  namespace: bench-arrow
  labels: { app: bench-arrow-agent, benchmark: otel-arrow-bench, benchmark.arm: C, benchmark.component: agent, engine: df-engine-otlp }
spec:
  selector: { matchLabels: { app: bench-arrow-agent } }
  template:
    metadata:
      labels: { app: bench-arrow-agent, benchmark: otel-arrow-bench, benchmark.arm: C, benchmark.component: agent, engine: df-engine-otlp }
      annotations: { dynatrace.com/inject: "false", oneagent.dynatrace.com/inject: "false", sidecar.istio.io/inject: "false" }
    spec:
      serviceAccountName: bench-arrow
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.163.1
          args: [ "--config=/conf/config.yaml" ]
          env: [ { name: K8S_NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } } ]
          ports: [ { name: metrics, containerPort: 8888 } ]
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 512Mi } }
          volumeMounts:
            - { name: config, mountPath: /conf }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - { name: config, configMap: { name: bench-arrow-agent-config } }
        - { name: varlogpods, hostPath: { path: /var/log/pods } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-arrow-dfengine
  namespace: bench-arrow
  labels: { app: bench-arrow-dfengine, benchmark: otel-arrow-bench, benchmark.arm: C, benchmark.component: df-engine, engine: df-engine-otlp }
spec:
  replicas: 1
  selector: { matchLabels: { app: bench-arrow-dfengine } }
  template:
    metadata:
      labels: { app: bench-arrow-dfengine, benchmark: otel-arrow-bench, benchmark.arm: C, benchmark.component: df-engine, engine: df-engine-otlp }
      annotations: { dynatrace.com/inject: "false", oneagent.dynatrace.com/inject: "false", sidecar.istio.io/inject: "false" }
    spec:
      serviceAccountName: bench-arrow
      containers:
        - name: df-engine
          image: ghcr.io/henrikrexed/df-engine:0.61.0
          args: [ "--config", "/conf/df_engine.yaml" ]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          resources: { requests: { cpu: 300m, memory: 512Mi }, limits: { memory: 2Gi } }
          volumeMounts: [ { name: config, mountPath: /conf } ]
      volumes: [ { name: config, configMap: { name: bench-arrow-dfengine-config } } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-arrow-forwarder
  namespace: bench-arrow
  labels: { app: bench-arrow-forwarder, benchmark: otel-arrow-bench, benchmark.arm: C, benchmark.component: forwarder }
spec:
  replicas: 1
  selector: { matchLabels: { app: bench-arrow-forwarder } }
  template:
    metadata:
      labels: { app: bench-arrow-forwarder, benchmark: otel-arrow-bench, benchmark.arm: C, benchmark.component: forwarder }
      annotations: { dynatrace.com/inject: "false", oneagent.dynatrace.com/inject: "false", sidecar.istio.io/inject: "false" }
    spec:
      serviceAccountName: bench-arrow
      containers:
        - name: forwarder
          image: otel/opentelemetry-collector-contrib:0.163.1
          args: [ "--config=/conf/config.yaml" ]
          env: [ { name: DT_INGEST_TOKEN, valueFrom: { secretKeyRef: { name: dynatrace-otlp, key: dataIngestToken } } } ]
          ports: [ { name: otlp-grpc, containerPort: 4317 } ]
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 1Gi } }
          volumeMounts: [ { name: config, mountPath: /conf } ]
      volumes: [ { name: config, configMap: { name: bench-arrow-fwd-config } } ]
