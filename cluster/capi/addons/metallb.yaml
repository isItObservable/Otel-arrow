# MetalLB — installed via CAAPH HelmChartProxy.
#
# Installs the MetalLB controller + speaker + CRDs on the workload cluster. The
# address pool + L2Advertisement are separate workload-cluster CRs, applied after
# the MetalLB CRDs exist — see cluster/capi/metallb.yaml.
#
# Selector: matches Cluster objects labeled `addons.otel-arrow: "true"`.
---
apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: metallb
  namespace: default
  labels:
    cluster.x-k8s.io/aggregate-to-addons: "true"
spec:
  clusterSelector:
    matchLabels:
      addons.otel-arrow: "true"
  repoURL: https://metallb.github.io/metallb
  chartName: metallb
  version: 0.14.9
  releaseName: metallb
  namespace: metallb-system
