# OTel-Arrow df-engine dashboard — published in tenant oat05854.dev.apps.dynatracelabs.com:
#   id:  37e6f014-6167-45be-a9f9-85a0d71a7385
#   url: https://oat05854.dev.apps.dynatracelabs.com/ui/apps/dynatrace.dashboards/dashboard/37e6f014-6167-45be-a9f9-85a0d71a7385
# Publish with:  dtctl apply --file otel-arrow-dashboard.yaml   (id pinned -> updates in place)
#
# Layout: an operator overview (engines running, data in/out, errors) on top, then
# detailed views — engine-internal metrics (scraped from each df-engine :8080, converted
# cumulative->delta, exported OTLP; see df-engine-internal-metrics-collector.yaml) and the
# df-engine pod resource usage from the Dynatrace operator.
id: 37e6f014-6167-45be-a9f9-85a0d71a7385
isPrivate: false
name: OTel-Arrow df-engine
type: dashboard
content:
  importedWithCode: false
  settings: {}
  version: 1
  variables: []
  tiles:
    # ── Operator overview ────────────────────────────────────────────────────
    '0':
      title: Engines running
      type: data
      query: 'timeseries m = avg(dt.kubernetes.container.memory_working_set), by:{k8s.pod.name}, filter:{ k8s.cluster.name == "observable-otelarrow" and matchesValue(k8s.workload.name, "*df-engine*") } | summarize engines = countDistinct(k8s.pod.name)'
      visualization: singleValue
      visualizationSettings: &sv
        chartSettings: {}
        singleValue:
          showTrend: false
          showSparkline: false
        table: {}
        thresholds: []
      querySettings: {}
    '1':
      title: Data in — records received (selected timeframe)
      type: data
      query: 'timeseries din = sum(recv_count_total), filter:{ node_type == "receiver" } | fieldsAdd t = arraySum(din) | summarize records_in = sum(t)'
      visualization: singleValue
      visualizationSettings: *sv
      querySettings: {}
    '2':
      title: Data out — records exported (selected timeframe)
      type: data
      query: 'timeseries dout = sum(send_count_total), filter:{ node_type == "exporter" } | fieldsAdd t = arraySum(dout) | summarize records_out = sum(t)'
      visualization: singleValue
      visualizationSettings: *sv
      querySettings: {}
    '3':
      title: Errors — backpressure + closed-channel + dropped/nacked signals (0 = healthy)
      type: data
      query: 'timeseries a = sum(send_error_full_total), b = sum(send_error_closed_total), c = sum(signals_dropped_metrics_total), d = sum(signals_dropped_logs_total), e = sum(signals_nacked_metrics_total) | fieldsAdd errors = arraySum(a)+arraySum(b)+arraySum(c)+arraySum(d)+arraySum(e) | fields errors'
      visualization: singleValue
      visualizationSettings:
        chartSettings: {}
        singleValue:
          showTrend: false
          showSparkline: false
        table: {}
        thresholds:
          - value: 1
            color: '#c41425'
          - value: 0
            color: '#2f6d21'
      querySettings: {}
    '4':
      title: Data flow — records in vs out over time
      type: data
      query: 'timeseries data_in = sum(recv_count_total), filter:{ node_type == "receiver" } | append [ timeseries data_out = sum(send_count_total), filter:{ node_type == "exporter" } ]'
      visualization: lineChart
      visualizationSettings: &lc
        chartSettings: {}
        singleValue: {}
        table: {}
        thresholds: []
      querySettings: {}
    '5':
      title: Errors over time — backpressure / closed-channel / dropped (flat 0 = healthy)
      type: data
      query: 'timeseries backpressure = sum(send_error_full_total) | append [ timeseries closed = sum(send_error_closed_total) ] | append [ timeseries dropped = sum(signals_dropped_metrics_total) ]'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    # ── Engine internals — detail ────────────────────────────────────────────
    '6':
      type: markdown
      content: '## Engine internals — detail'
    '7':
      title: Node throughput — messages sent per bin, by DAG node (send_count)
      type: data
      query: 'timeseries sent = sum(send_count_total), by:{node_id, node_type}'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '8':
      title: Node intake — messages received per bin, by DAG node (recv_count)
      type: data
      query: 'timeseries recv = sum(recv_count_total), by:{node_id, node_type}'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '9':
      title: Payload throughput — bytes moved per bin, by DAG node (payload_size_bytes)
      type: data
      query: 'timeseries bytes = sum(payload_size_bytes_total), by:{node_id}'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '10':
      title: Channel backpressure & closed-channel errors, by node (flat 0 = healthy)
      type: data
      query: 'timeseries full = sum(send_error_full_total), by:{node_id} | append [ timeseries closed = sum(send_error_closed_total), by:{node_id} ]'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '11':
      title: Signals dropped & nacked (logs/metrics/traces; flat 0 = no loss)
      type: data
      query: 'timeseries dropped = sum(signals_dropped_metrics_total) | append [ timeseries dropped_logs = sum(signals_dropped_logs_total) ] | append [ timeseries nacked = sum(signals_nacked_metrics_total) ]'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '12':
      title: Engine runtime CPU utilization
      type: data
      query: 'timeseries cpu = avg(cpu_utilization), by:{k8s.workload.name}'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '13':
      title: Engine process memory in use
      type: data
      query: 'timeseries m = avg(process_memory_usage_bytes), by:{k8s.workload.name}'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '14':
      title: Engine saturation — global task queue & buffered pending sends
      type: data
      query: 'timeseries { q = avg(global_task_queue_size), pending = avg(pending_sends_buffered) }, by:{k8s.workload.name}'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    # ── Pod resources — detail (Dynatrace operator) ──────────────────────────
    '15':
      type: markdown
      content: '## Pod resources — detail (Dynatrace operator)'
    '16':
      title: CPU per df-engine pod
      type: data
      query: 'timeseries cpu = avg(dt.kubernetes.container.cpu_usage), by:{k8s.workload.name, k8s.pod.name}, filter:{ k8s.cluster.name == "observable-otelarrow" and matchesValue(k8s.workload.name, "*df-engine*") }'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '17':
      title: CPU utilization vs limit (%) per df-engine pod
      type: data
      query: 'timeseries { cpu = avg(dt.kubernetes.container.cpu_usage), lim = avg(dt.kubernetes.container.limits_cpu) }, by:{k8s.workload.name, k8s.pod.name}, filter:{ k8s.cluster.name == "observable-otelarrow" and matchesValue(k8s.workload.name, "*df-engine*") }'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '18':
      title: Memory working set per df-engine pod
      type: data
      query: 'timeseries mem = avg(dt.kubernetes.container.memory_working_set), by:{k8s.workload.name, k8s.pod.name}, filter:{ k8s.cluster.name == "observable-otelarrow" and matchesValue(k8s.workload.name, "*df-engine*") }'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '19':
      title: Memory utilization vs limit (%) per df-engine pod
      type: data
      query: 'timeseries { mem = avg(dt.kubernetes.container.memory_working_set), lim = avg(dt.kubernetes.container.limits_memory) }, by:{k8s.workload.name, k8s.pod.name}, filter:{ k8s.cluster.name == "observable-otelarrow" and matchesValue(k8s.workload.name, "*df-engine*") }'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '20':
      title: CPU throttling per df-engine pod (flat/low = not CPU-starved)
      type: data
      query: 'timeseries thr = avg(dt.kubernetes.container.cpu_throttled), by:{k8s.workload.name, k8s.pod.name}, filter:{ k8s.cluster.name == "observable-otelarrow" and matchesValue(k8s.workload.name, "*df-engine*") }'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
    '21':
      title: Pod network I/O — received & transmitted per df-engine pod
      type: data
      query: 'timeseries { rx = avg(dt.kubernetes.pod.network_received_data), tx = avg(dt.kubernetes.pod.network_transmitted_data) }, by:{k8s.workload.name, k8s.pod.name}, filter:{ k8s.cluster.name == "observable-otelarrow" and matchesValue(k8s.workload.name, "*df-engine*") }'
      visualization: lineChart
      visualizationSettings: *lc
      querySettings: {}
  layouts:
    '0': { x: 0, y: 0, w: 6, h: 4 }
